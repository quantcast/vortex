gradle.projectsEvaluated {
    def project = rootProject.findProject(':vortex-spark-4.0_2.13')
    if (project == null) return
    rootProject.spotless.java {
        target(rootProject.fileTree('vortex-spark/common') { include('**/*.java') },
                rootProject.fileTree('vortex-spark/benchmarks') { include('**/*.java') })
    }
    project.tasks.register('capacityBenchmarkClasspath') {
        dependsOn project.tasks.named('classes')
        dependsOn project.tasks.named('benchmarkClasses')
        dependsOn rootProject.project(':vortex-jni').tasks.named('shadowJar')
        doLast {
            def directory = project.layout.buildDirectory.dir('capacity-benchmark').get().asFile
            directory.mkdirs()
            new File(directory, 'classpath.txt').text = project.sourceSets.main.output.asPath + File.pathSeparator +
                    project.sourceSets.benchmark.runtimeClasspath.asPath + File.pathSeparator +
                    rootProject.project(':vortex-jni').tasks.named('shadowJar').get().outputs.files.asPath
            def compiler = project.tasks.named('compileJava').get().javaCompiler.get()
            new File(directory, 'java-home.txt').text = compiler.metadata.installationPath.asFile.absolutePath
        }
    }
}
